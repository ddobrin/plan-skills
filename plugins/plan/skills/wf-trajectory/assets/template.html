<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fff;--fg:#1a1a2e;--muted:#6b7280;--card:#f6f7f9;--line:#e5e7eb;--accent:#4f46e5;--ok:#16a34a;--fail:#dc2626;--run:#d97706;--queued:#cbd5e1}
[data-theme="dark"]{--bg:#0f1117;--fg:#e5e7eb;--muted:#9ca3af;--card:#171a21;--line:#2a2f3a;--accent:#818cf8;--ok:#22c55e;--fail:#ef4444;--run:#f59e0b;--queued:#374151}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:600}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:var(--muted)}
.badge.ok{background:var(--ok)}.badge.fail{background:var(--fail)}.badge.run{background:var(--run)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-weight:600}
button#theme{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
main{padding:20px 24px;max-width:1200px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:28px 0 10px}
details.phase{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
details.phase>summary{padding:10px 14px;background:var(--card);cursor:pointer;font-weight:600;list-style:none}
.pdetail{color:var(--muted);font-weight:400;margin-left:8px}
.pcount{color:var(--muted);font-weight:400;float:right}
.agents{padding:6px 14px}
details.agent{border-top:1px solid var(--line);padding:6px 0}
details.agent>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.agent.state-done .dot{background:var(--ok)}
.agent.state-error .dot{background:var(--fail)}
.agent.state-running .dot,.agent.state-queued .dot{background:var(--run)}
.label{font-weight:600}
.meta{color:var(--muted);font-size:12px;margin-left:auto}
.body{padding:8px 0 8px 19px}
.kv b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:8px}
pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;margin:4px 0;max-height:280px;overflow:auto}
.tlink{display:inline-block;margin-top:8px;color:var(--accent);text-decoration:none;font-size:12px}
.timeline{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.trow{display:flex;align-items:center;gap:12px;margin:4px 0}
.tlabel{width:220px;flex:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;flex:1;height:14px;background:var(--card);border-radius:4px}
.seg{position:absolute;top:0;height:14px;border-radius:4px}
.seg.queued{background:var(--queued)}
.seg.active{background:var(--accent)}
.seg.active.state-error{background:var(--fail)}
.seg.active.state-running,.seg.active.state-queued{background:var(--run)}
details>summary::-webkit-details-marker{display:none}
@media print{button#theme{display:none}details{break-inside:avoid}}
</style>
</head>
<body data-theme="light">
<header>
<h1>{{TITLE}}</h1>
<span class="badge {{STATUS_CLASS}}">{{STATUS}}</span>
<div class="stats">{{SUMMARY}}</div>
<button id="theme">theme</button>
</header>
<main>
<h2>Timeline</h2>
<div class="timeline">{{TIMELINE}}</div>
<h2>Execution tree</h2>
{{TREE}}
<h2>Result</h2>
<details><summary>workflow return value</summary><pre>{{RESULT_JSON}}</pre></details>
<p style="color:var(--muted);font-size:12px;margin-top:24px">Run timestamp: {{TIMESTAMP}} - generated by wf-trajectory</p>
</main>
<script>
(function(){
  var b=document.body,k="va-theme";
  try{var s=localStorage.getItem(k);if(s){b.setAttribute("data-theme",s);}}catch(e){}
  var t=document.getElementById("theme");
  if(t){t.addEventListener("click",function(){
    var n=b.getAttribute("data-theme")==="dark"?"light":"dark";
    b.setAttribute("data-theme",n);
    try{localStorage.setItem(k,n);}catch(e){}
  });}
})();
</script>
</body>
</html>
